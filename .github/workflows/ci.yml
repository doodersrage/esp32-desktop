name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The core does not exist until phase 0. Skip cleanly until it does.
      - name: Check for core
        id: has
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "No core/Cargo.toml yet; skipping."
          fi

      - name: Install system dependencies
        if: steps.has.outputs.core == 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Cache cargo
        if: steps.has.outputs.core == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Format
        if: steps.has.outputs.core == 'true'
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: Clippy
        if: steps.has.outputs.core == 'true'
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test
        if: steps.has.outputs.core == 'true'
        run: cargo test --manifest-path core/Cargo.toml --locked

  ui:
    name: Qt UI
    runs-on: ubuntu-latest
    # Build on Arch, the only supported platform.
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git base-devel cmake ninja qt6-base

      - uses: actions/checkout@v4

      # The UI does not exist until phase 1. Skip cleanly until it does.
      - name: Check for UI
        id: has
        run: |
          if [ -f ui/CMakeLists.txt ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No ui/CMakeLists.txt yet; skipping."
          fi

      - name: Configure
        if: steps.has.outputs.ui == 'true'
        run: cmake -S ui -B build/ui -G Ninja

      - name: Build
        if: steps.has.outputs.ui == 'true'
        run: cmake --build build/ui

      - name: Test
        if: steps.has.outputs.ui == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ui --output-on-failure
