name: Windows

# Build ESP32 Bench for Windows (x86-64) and smoke-test it: the core and UI with MSVC,
# and lcgamboa's QEMU fork with esp32bench's patches, built statically with MSYS2 and
# shipped with the app as DLLs (docs/platforms.md). Phase 6 (docs/PLAN.md).

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'ui/**'
      - 'packaging/windows/**'
      - 'tests/platforms/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
  # Release builds: packages.yml calls this on a version tag and attaches the result.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  FORK_REPO: https://github.com/lcgamboa/qemu.git
  FORK_COMMIT: 885a6e7061fb70fac78a074a719423810bc19a17

jobs:
  firmware:
    name: Smoke-test firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          export IDF_PATH=/opt/esp/idf
          for p in hello gpio; do bash tests/firmware/build.sh "$p"; done
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-firmware
          path: tests/firmware/out/*.bin
          if-no-files-found: error

  simulator:
    name: Simulator (MSYS2)
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: No line-ending conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: From the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: sim-out
          key: windows-sim-${{ env.FORK_COMMIT }}-${{ hashFiles('core/crates/sim/patches/**', 'tests/platforms/link-library.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman mingw-w64-ucrt-x86_64-libgcrypt
            mingw-w64-ucrt-x86_64-libslirp
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git config --global core.autocrlf false
          mkdir fork && cd fork
          git init -q && git remote add origin "$FORK_REPO"
          git fetch -q --depth 1 origin "$FORK_COMMIT" && git checkout -q FETCH_HEAD
          git apply ../core/crates/sim/patches/*.patch
          mkdir build && cd build
          # Statically: the fork links libslirp statically, and on MSYS2 that brings
          # glib's static library in beside its DLL (docs/platforms.md).
          ../configure --target-list=xtensa-softmmu,riscv32-softmmu --enable-slirp \
            --enable-gcrypt --enable-pixman --disable-werror --static
          make -j"$(nproc)"
          cd ..
          for a in xtensa riscv32; do sh ../tests/platforms/link-library.sh build $a; done
          # The functions esp32bench-qemu-host looks up must be exported.
          for a in xtensa riscv32; do
            for f in qemu_init qemu_main_loop qemu_picsimlab_register_callbacks \
                     qemu_picsimlab_set_pin qemu_picsimlab_set_apin bql_lock_impl qemu_clock_get_ns; do
              objdump -p build/libqemu-$a.dll | grep -qw "$f" || { echo "libqemu-$a.dll does not export $f"; exit 1; }
            done
          done
          mkdir -p ../sim-out/build
          cp build/libqemu-*.dll ../sim-out/build/
          cp -R pc-bios ../sim-out/pc-bios
          git rev-parse HEAD > ../sim-out/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: windows-simulator
          path: sim-out
          if-no-files-found: error

  app:
    name: Build and smoke-test the app
    needs: [firmware, simulator]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-firmware
          path: tests/firmware/out
      - uses: actions/download-artifact@v4
        with:
          name: windows-simulator
          path: sim-out
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      # PowerShell, not Git Bash: Git Bash's /usr/bin/link shadows MSVC's link.exe.
      - name: Core
        shell: pwsh
        run: cargo build --release --locked --manifest-path core/Cargo.toml
      - name: UI
        shell: pwsh
        run: |
          cmake -S ui -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ui
      - name: UI tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export ESP32BENCH_DAEMON="$(cygpath -w "$PWD/core/target/release/esp32benchd.exe")"
          export QT_FORCE_STDERR_LOGGING=1
          set +e
          # Each test once, keeping its own log: ctest shows none of a Windows test's
          # output, so a failure there said nothing. A failed one's log is shown,
          # then it runs again verbosely, with its exit code (a crash shows no log).
          failed=()
          for t in $(ctest --test-dir build/ui -N | sed -n 's/.*Test *#[0-9]*: \(tst_[a-z]*\).*/\1/p'); do
            start=$SECONDS
            ./build/ui/$t.exe -o "$t.txt,txt" > "$t.out" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              echo "ok   $t ($(( SECONDS - start )) s)"
              continue
            fi
            failed+=("$t")
            printf '=== %s failed: exit code %d (0x%08X) after %d s\n' "$t" "$code" "$(( code & 0xFFFFFFFF ))" "$(( SECONDS - start ))"
            grep -E 'FAIL!|Loc:|Actual|Expected|QWARN|QFATAL|Totals' "$t.txt" 2> /dev/null | head -40
            tail -20 "$t.out"
          done
          [ ${#failed[@]} -eq 0 ] && exit 0
          for t in "${failed[@]}"; do
            echo "=== $t again"
            ./build/ui/$t.exe -o "$t-again.txt,txt" -o -,txt -v2 2>&1 | tail -60
            code=${PIPESTATUS[0]}
            printf 'exit code %d (0x%08X)\n' "$code" "$(( code & 0xFFFFFFFF ))"
          done
          exit 1

      # ESP-IDF as Espressif's guide installs it on Windows (a clone in
      # %USERPROFILE%\esp\esp-idf and its install.ps1), for the smoke test's build of a
      # local ESP-IDF project. Python 3.12: the runner's newest Python can be ahead of
      # what ESP-IDF's requirements have wheels for.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ESP-IDF
        shell: pwsh
        run: |
          $v = (Get-Content tests/firmware/IDF_VERSION).Trim()
          $idf = "$env:USERPROFILE\esp\esp-idf"
          git clone -q -b $v --depth 1 --recursive --shallow-submodules https://github.com/espressif/esp-idf.git $idf
          & "$idf\install.ps1" esp32s3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package
        shell: bash
        run: packaging/windows/build.sh "$PWD" core/target build/ui sim-out dist
      - name: Smoke test
        timeout-minutes: 60
        env:
          ESP32BENCH_SMOKE_BUILD: '1'
          ESP32BENCH_SMOKE_IDF: '1'
        shell: bash
        run: packaging/windows/smoke.sh dist/*.zip tests/firmware/out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  # ESP-IDF installed by Espressif's installation manager (EIM, through Espressif's
  # action), found by the packaged app without IDF_PATH, from what EIM recorded
  # (eim_idf.json), and a local project built with it.
  idf-eim:
    name: ESP-IDF from Espressif's installer
    needs: [app]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: dist
      # The action's own deactivate script can fail after EIM has installed ESP-IDF
      # ("name 'e' is ambiguous"); what matters here is the install, checked below.
      - uses: espressif/install-esp-idf-action@v1
        continue-on-error: true
        with:
          version: v6.0.2
      - name: What EIM recorded
        shell: pwsh
        run: |
          Get-ChildItem -Path C:\esp, C:\Espressif, "$env:USERPROFILE\.espressif", "$env:LOCALAPPDATA", "$env:APPDATA" -Filter eim_idf.json -Recurse -Depth 4 -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Output "== $($_.FullName)"; Get-Content $_.FullName }
          Write-Output "IDF_PATH=$env:IDF_PATH IDF_TOOLS_PATH=$env:IDF_TOOLS_PATH IDF_PYTHON_ENV_PATH=$env:IDF_PYTHON_ENV_PATH"
      - name: Build a local project
        shell: bash
        run: |
          set -euo pipefail
          # As a user's app sees it: none of the action's variables.
          unset IDF_PATH IDF_TOOLS_PATH IDF_PYTHON_ENV_PATH ESP_IDF_VERSION
          work=$(mktemp -d)
          unzip -q dist/*.zip -d "$work"
          bin=$(dirname "$(find "$work" -name esp32bench.exe | head -1)")
          "$bin/esp32bench.exe" local list 2>&1 | tee "$work/list.txt"
          grep -q "ESP-IDF 6.0.2 at " "$work/list.txt"
          cp -R tests/firmware/hello "$work/hello"
          id=$("$bin/esp32bench.exe" local open "$(cygpath -w "$work/hello")" | awk '{ print $1 }')
          "$bin/esp32bench.exe" build "$id" --board esp32c3 > "$work/build.log" 2>&1 || { tail -60 "$work/build.log"; exit 1; }
          find "$(cygpath -u "$LOCALAPPDATA")/esp32bench/cache" -name "$id.ino.merged.bin" | grep -q . 
          echo "built with the EIM install"
