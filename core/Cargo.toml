[workspace]
resolver = "3"
members = [
    "crates/sim",
    "crates/cli",
    "crates/qemu-host",
    "crates/rpc",
    "crates/device",
    "crates/daemon",
    "crates/library",
    "crates/build",
    "crates/serial",
    "crates/toolchain",
    "crates/flash",
    "crates/debug",
    "crates/circuit",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.61", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
udev = "0.9"
