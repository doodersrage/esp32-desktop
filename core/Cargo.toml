[workspace]
resolver = "3"
members = ["crates/sim", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false
# Licence: GPL, version chosen at the end of phase 0 (see docs/PLAN.md).

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
