[package]
name = "esp32bench-daemon"
description = "The esp32bench core daemon: serves the JSON-RPC API on a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "esp32benchd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
esp32bench-build = { path = "../build" }
esp32bench-device = { path = "../device" }
esp32bench-library = { path = "../library" }
esp32bench-rpc = { path = "../rpc" }
esp32bench-serial = { path = "../serial" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
libc.workspace = true
esp32bench-library = { path = "../library" }
jsonschema.workspace = true
tempfile.workspace = true
