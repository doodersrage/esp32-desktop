[package]
name = "esp32bench-daemon"
description = "The esp32bench core daemon: serves the JSON-RPC API on a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "esp32benchd"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
esp32bench-distro = { path = "../distro" }
anyhow.workspace = true
base64.workspace = true
esp32bench-build = { path = "../build" }
esp32bench-circuit = { path = "../circuit" }
esp32bench-debug = { path = "../debug" }
esp32bench-device = { path = "../device" }
esp32bench-flash = { path = "../flash" }
esp32bench-library = { path = "../library" }
esp32bench-rpc = { path = "../rpc" }
esp32bench-serial = { path = "../serial" }
esp32bench-sim = { path = "../sim" }
esp32bench-toolchain = { path = "../toolchain" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
libc.workspace = true
esp32bench-library = { path = "../library" }
jsonschema.workspace = true
tempfile.workspace = true
